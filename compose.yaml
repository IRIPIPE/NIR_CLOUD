name: nir-cloud

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-nir_cloud}
  POSTGRES_USER: ${POSTGRES_USER:-nir_cloud}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - file_data:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  file_data:
